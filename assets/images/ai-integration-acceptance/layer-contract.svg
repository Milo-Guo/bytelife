<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">把请求处理链和各层职责写清楚</title>
  <desc id="desc">前端UI经过接口router、业务service、数据访问CRUD、ORM表映射到数据库。schemas在边界定义请求响应结构；事务由业务用例协调，实际目录与边界按项目约定。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#64748b" stroke-width="2.2"/></marker>
    <style>text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:#17243b}.title{font-size:36px;font-weight:700}.sub{font-size:22px;fill:#576780}.label{font-size:26px;font-weight:700}.body{font-size:22px;fill:#334155}.code{font-size:22px;fill:#315ea8}.note{font-size:22px;fill:#8a4b12}</style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#f6f8fc"/>
  <rect x="40" y="42" width="7" height="72" rx="3.5" fill="#2563eb"/>
  <text class="title" x="64" y="77">把请求处理链和各层职责写清楚</text>
  <text class="sub" x="64" y="113">本文归纳 · 以常见分层结构为例，沿用项目已有目录与依赖方向</text>
  <rect x="410" y="204" width="752" height="188" rx="18" fill="#fff9ec" stroke="#d6a856" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="note" x="426" y="184">业务用例协调事务，写清提交和回滚的条件</text>
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"><path d="M212 295 H231"/><path d="M400 295 H419"/><path d="M588 295 H607"/><path d="M776 295 H795"/><path d="M964 295 H983"/></g>
  <g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="44" y="236" width="168" height="122" rx="15"/><rect x="232" y="236" width="168" height="122" rx="15"/><rect x="420" y="236" width="168" height="122" rx="15"/><rect x="608" y="236" width="168" height="122" rx="15"/><rect x="796" y="236" width="168" height="122" rx="15"/><rect x="984" y="236" width="168" height="122" rx="15"/></g>
  <text class="label" x="60" y="273">前端页面</text><text class="code" x="60" y="308">UI</text><text class="body" x="60" y="339">收集用户操作</text>
  <text class="label" x="248" y="273">接口入口</text><text class="code" x="248" y="308">router</text><text class="body" x="248" y="339">解析与校验</text>
  <text class="label" x="436" y="273">业务用例</text><text class="code" x="436" y="308">service</text><text class="body" x="436" y="339">规则与编排</text>
  <text class="label" x="624" y="273">数据访问</text><text class="code" x="624" y="308">CRUD</text><text class="body" x="624" y="339">执行查询写入</text>
  <text class="label" x="812" y="273">表映射</text><text class="code" x="812" y="308">ORM model</text><text class="body" x="812" y="339">映射数据实体</text>
  <text class="label" x="1000" y="273">数据库</text><text class="code" x="1000" y="308">database</text><text class="body" x="1000" y="339">约束与存储</text>
  <path d="M316 358 V435" fill="none" stroke="#4d7db7" stroke-width="2.5" stroke-dasharray="6 5"/>
  <rect x="232" y="435" width="510" height="112" rx="16" fill="#eef5ff" stroke="#93b7eb" stroke-width="2"/>
  <text class="label" x="254" y="475">schemas 定义请求与响应结构</text>
  <text class="body" x="254" y="516">参数类型、字段约束、序列化</text>
  <text class="body" x="783" y="477">属于数据边界</text><text class="body" x="783" y="516">不负责 SQL 或业务编排</text>
  <rect x="40" y="589" width="1120" height="57" rx="12" fill="#e8eef8"/>
  <text class="body" x="62" y="625">参数可来自路径、查询或请求体；目录与事务边界按项目约定，不机械套用层名。</text>
</svg>

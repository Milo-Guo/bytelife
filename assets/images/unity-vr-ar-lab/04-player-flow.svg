<text x="192.5" y="436" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#18304b" text-anchor="middle">人物看起来在走路或跳跃</text>
<rect x="870" y="355" width="275" height="117" rx="18" fill="#ffffff" stroke="#d3dfec" stroke-width="2"/>

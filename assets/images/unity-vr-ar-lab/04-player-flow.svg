<text x="595.0" y="226" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#18304b" text-anchor="middle">QueryLocomotionController</text>
<text x="595.0" y="258" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#18304b" text-anchor="middle">读取输入、计算运动与状态</text>

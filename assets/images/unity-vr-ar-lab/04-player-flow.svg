<text x="1007.5" y="616" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#18304b" text-anchor="middle">按目标位置更新镜头</text>
<text x="55" y="546" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#4c6077" text-anchor="start">移动与动画分工：</text>
<text x="55" y="583" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#4c6077" text-anchor="start">Controller 负责位置；Animator 主要负责动作表现。</text>
<text x="55" y="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#4c6077" text-anchor="start">本课现成控制器的 A/D 是转身，不是左右平移。</text>
<text x="615" y="324" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#4c6077" text-anchor="start">动作状态</text>
<text x="797" y="310" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#4c6077" text-anchor="end">A/D 转身</text>
<text x="1040" y="513" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#4c6077" text-anchor="start">目标位置</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">从设计依据到开发、验收与冻结</title>
  <desc id="desc">先确认设计与范围，再运行测试得到真实失败，完成最小实现并复跑测试，交独立角色做模块验收，全绿后才能进入冻结交接。未测试不等于Red，单卡全绿不等于已上线。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="2"/></marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b45309" stroke-width="2"/></marker>
    <style>text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:#17243b}.title{font-size:35px;font-weight:700}.sub{font-size:20px;fill:#576780}.step{font-size:25px;font-weight:700}.body{font-size:20px;fill:#334155}.note{font-size:20px;fill:#8a4b12}.small{font-size:18px;fill:#64748b}</style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#f6f8fc"/>
  <rect x="40" y="42" width="7" height="72" rx="3.5" fill="#2563eb"/>
  <text class="title" x="64" y="77">每一阶段都留下可核对的证据</text>
  <text class="sub" x="64" y="110">课堂流程整理 · 03 先测后码 → 04 模块验收 → 05 冻结交接</text>
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"><path d="M249 311 H267"/><path d="M484 311 H502"/><path d="M719 311 H737"/><path d="M954 311 H972"/></g>
  <rect x="35" y="214" width="210" height="202" rx="17" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="270" y="214" width="210" height="202" rx="17" fill="#fff7f7" stroke="#e7a3a3" stroke-width="2"/>
  <rect x="505" y="214" width="210" height="202" rx="17" fill="#f0fbf6" stroke="#86c6a7" stroke-width="2"/>
  <rect x="740" y="214" width="210" height="202" rx="17" fill="#eef5ff" stroke="#93b7eb" stroke-width="2"/>
  <rect x="975" y="214" width="190" height="202" rx="17" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="step" x="55" y="258">设计与范围</text>
  <text class="body" x="55" y="304"><tspan x="55">核实文档、接口</tspan><tspan x="55" dy="31">确定本卡边界</tspan><tspan x="55" dy="31">写清验收条件</tspan></text>
  <text class="step" x="290" y="258">03 · Red</text>
  <text class="body" x="290" y="304"><tspan x="290">先运行本卡测试</tspan><tspan x="290" dy="31">确认真实失败</tspan><tspan x="290" dy="31">保存原因与证据</tspan></text>
  <text class="step" x="525" y="258">03 · Green</text>
  <text class="body" x="525" y="304"><tspan x="525">做最小实现</tspan><tspan x="525" dy="31">复跑相关测试</tspan><tspan x="525" dy="31">核查本卡产物</tspan></text>
  <text class="step" x="760" y="258">04 · 独立验收</text>
  <text class="body" x="760" y="304"><tspan x="760">模块开发卡完成</tspan><tspan x="760" dy="31">三层逐条核对 AC</tspan><tspan x="760" dy="31">输出验收报告</tspan></text>
  <text class="step" x="995" y="258">05 · 冻结</text>
  <text class="body" x="995" y="304"><tspan x="995">本批验收全绿</tspan><tspan x="995" dy="31">准备发布单</tspan><tspan x="995" dy="31">与回滚步骤</tspan></text>
  <path d="M375 214 V167 H140 V204" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#return)"/>
  <text class="note" x="174" y="157">输入缺口，先补设计</text>
  <path d="M610 416 V458 H375 V426" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#return)"/>
  <text class="note" x="391" y="488">测试未过，回到本卡</text>
  <path d="M845 416 V514 H610 V426" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#return)"/>
  <text class="note" x="677" y="545">验收未过，退回责任卡</text>
  <rect x="40" y="582" width="1120" height="59" rx="12" fill="#e8eef8"/>
  <text x="62" y="619" font-size="23" font-weight="700">未测试 ≠ Red</text>
  <text x="348" y="619" font-size="23" font-weight="700">单卡全绿 ≠ 已上线</text>
  <text class="small" x="744" y="618">有红点先报告，不能跳过验收与冻结。</text>
</svg>

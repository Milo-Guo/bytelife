name: practice-shop
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8008:8008"
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?请先运行初始化脚本}
      DB_KIND: sqlite
      DATA_DIR: /app/data
    volumes:
      - shop-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  shop-data:

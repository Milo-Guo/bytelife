<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 24px 16px; text-align: center; background: #f6f9fb; color: #162b3a; }
    main { max-width: 560px; margin: auto; }
    h1 { font-size: 24px; }
    #character { width: 110px; height: 90px; margin: 28px auto; border-radius: 50% 50% 40% 40%; background: #4cc3df; display: grid; place-items: center; font-size: 32px; }
    .speaking { animation: bounce 0.4s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    #chat-box { height: 350px; overflow-y: auto; background: white; border: 1px solid #d8e2e8; border-radius: 12px; padding: 12px; text-align: left; }
    .message { max-width: 85%; padding: 12px; border-radius: 10px; margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { background: #d6ece4; margin-left: auto; }
    .ai { background: #edf1f5; }
    #input-area { display: flex; gap: 8px; margin: 12px 0; }
    input[type=text] { min-width: 0; flex: 1; padding: 12px; font-size: 16px; border: 1px solid #9eb2bf; border-radius: 6px; }
    button { padding: 12px 16px; background: #126b8c; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #status { min-height: 24px; font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { .speaking { animation: none; } }
  </style>
</head>
<body>
<main>
  <h1>相棒AI 学习版</h1>
  <!-- 使用CSS绘制的示意角色，便于读代码，不包含课堂原图。 -->
  <div id="character" aria-hidden="true">•‿•</div>
  <div id="chat-box" role="log" aria-label="会話"></div>
  <form id="input-area">
    <input id="user-input" type="text" maxlength="2000" placeholder="メッセージを入力…" aria-label="メッセージ">
    <button id="send-btn" type="submit">送信</button>
  </form>
  <label><input id="voice-on" type="checkbox"> 日本語で読み上げる</label>
  <p id="status" role="status"></p>
</main>
<script>
  let chatHistory = [];
  let busy = false;
  const input = document.getElementById('user-input');
  const button = document.getElementById('send-btn');
  const character = document.getElementById('character');
  const statusBox = document.getElementById('status');

  document.getElementById('input-area').addEventListener('submit', function(event) {
    event.preventDefault();
    sendMessage();
  });

  function addMessageToChat(sender, text) {
    const box = document.getElementById('chat-box');
    const message = document.createElement('div');
    message.className = 'message ' + sender;
    message.textContent = text;
    box.appendChild(message);
    box.scrollTop = box.scrollHeight;
  }

  function setBusy(value) {
    busy = value;
    button.disabled = value;
    character.classList.toggle('speaking', value);
    statusBox.textContent = value ? '考え中…' : '';
  }

  function sendMessage() {
    const message = input.value.trim();
    if (!message || busy) return;
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      statusBox.textContent = '请通过 Apps Script 部署后的网页地址打开本页。';
      return;
    }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    addMessageToChat('user', message);
    input.value = '';
    setBusy(true);

    google.script.run
      .withSuccessHandler(function(result) {
        chatHistory = result.newHistory;
        addMessageToChat('ai', result.reply);
        setBusy(false);
        input.focus();
        if (document.getElementById('voice-on').checked) speakText(result.reply);
      })
      .withFailureHandler(function(error) {
        setBusy(false);
        statusBox.textContent = '发送失败：' + error.message;
        input.value = message;
        input.focus();
      })
      .chatWithGemini(message, chatHistory);
  }

  function speakText(text) {
    if (!window.speechSynthesis) {
      statusBox.textContent = '当前浏览器不支持语音朗读。';
      return;
    }
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    utterance.rate = 1.2;
    utterance.pitch = 1.5;
    utterance.onstart = function() { character.classList.add('speaking'); };
    utterance.onend = function() { character.classList.remove('speaking'); };
    utterance.onerror = function() { character.classList.remove('speaking'); };
    window.speechSynthesis.speak(utterance);
  }
</script>
</body>
</html>
